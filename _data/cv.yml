cv:
  name: Alexandra Pripadcheva
  label: PhD Candidate in Economics | Georgetown University
  email: ap1863@georgetown.edu
  location: Washington, DC
  pdf_cv_link: "/assets/pdf/cv_pdf.pdf"

  summary: >-
    My research combines high-performance numerical methods with 
    large-scale administrative and household microdata (HMDA, PSID, Zillow, Redfin, FHFA) to analyze 
    housing ladder frictions, mortgage markets disequilibrium, and wealth inequality.

  sections:
    Research Interests:
      - label: Computational Macroeconomics
        details: Heterogeneous-agent life-cycle models, dynamic programming, housing, mortgage & debt markets, multi-asset portfolio choice
      - label: Structural Econometrics
        details: Micro-econometric modeling, structural parameter estimation, Monte-Carlo methods, asymptotic inference, numerical estimation & inference bias
      - label: High-Performance Computing
        details: Parallel computing (Fortran/OpenMP), numerical optimization, high-dimensional state space solvers

    Education:
      - institution: Georgetown University
        degree: Ph.D. in Economics
        location: Washington, DC
        start_date: 2022
        end_date: present
        highlights:
          - "Advisors: Mark Huggett, Ivana Komunjer"
      - institution: New York University (NYU)
        degree: M.A. in Economics
        location: New York, NY
        start_date: 2020
        end_date: 2022
      - institution: Higher School of Economics (HSE)
        degree: M.S. in Financial Economics | B.A. in Economics
        location: Moscow, Russia
        start_date: 2015
        end_date: 2020

    Technical Toolkit:
      - label: Computational Methods & Languages
        details: Fortran, OpenMP, Parallel Computing (HPC), MatLab, Python, R, STATA, Git
      - label: Data Integration & Microeconometrics
        details: HMDA, PSID longitudinal panel, Zillow/Redfin housing data, FHFA price indexes
