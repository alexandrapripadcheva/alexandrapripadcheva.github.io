work_in_progress:
  - title: "Housing Taxation and Endogenous Sorting on the Housing Market"
    abstract: "Housing assets experience place-specific shocks. A big part of a local shock is taxation. I show how the disparities in taxation can sort some households out of the most preferable location and hence, deliver housing market disequilibrium."
