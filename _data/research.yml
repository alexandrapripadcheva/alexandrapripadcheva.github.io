work_in_progress:
  - title: "General Equilibrium of the Segmented Housing Market"
    abstract: "While housing markets are known to be segmented, existing literature mostly examines this segmentation through either isolated demand-side or supply-side frameworks. These frameworks obscure the complex effects on equilibrium prices and aggregate outcomes. To bridge this gap, I develop a general equilibrium model of a segmented housing market that integrates both demand and supply dynamics. This framework demonstrates how these dual forces either amplify or dampen one another. Specifically, the model evaluates the simultaneous propagation of monetary and fiscal policies across market segments, revealing their aggregate macroeconomic effects and distinct transmission channels."
